<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Orchestrator Server request manager">
  <title>Orchestrator Manager</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">PYODIDE · PWA</p>
      <h1>Orchestrator Manager</h1>
    </div>
    <span id="runtime-status" class="pill neutral">Python準備中</span>
  </header>

  <main class="container">
    <section class="panel connection-panel">
      <div class="section-heading">
        <div>
          <p class="eyebrow">CONNECTION</p>
          <h2>サーバー接続</h2>
        </div>
        <span id="connection-status" class="pill neutral">未接続</span>
      </div>
      <div class="connection-controls">
        <label class="field">
          <span>接続方式</span>
          <select id="connection-mode">
            <option value="cloudflare">Cloudflare URL</option>
            <option value="lan">LAN（IP:PORT）</option>
          </select>
        </label>
        <label class="field grow">
          <span id="endpoint-label">Cloudflare URL</span>
          <input id="endpoint" type="url" placeholder="https://xxxx.trycloudflare.com" autocomplete="url">
        </label>
        <button id="save-connection" class="button secondary">設定保存</button>
        <button id="test-connection" class="button primary">接続・一覧取得</button>
      </div>
      <p class="hint" id="connection-hint">CloudflareのHTTPS URLを入力してください。</p>
    </section>

    <section class="list-section">
      <div class="section-heading list-heading">
        <div>
          <p class="eyebrow">REQUESTS</p>
          <h2>リクエスト一覧 <span id="request-count" class="count">0</span></h2>
        </div>
        <div class="toolbar">
          <button id="refresh" class="button secondary" disabled>↻ 更新</button>
          <button id="add-request" class="button primary" disabled>＋ 新規追加</button>
        </div>
      </div>
      <div id="message" class="message" role="status" aria-live="polite"></div>
      <div id="request-list" class="request-list">
        <div class="empty-state">
          <strong>サーバーに接続してください</strong>
          <span>接続先を設定して「接続・一覧取得」を押してください。</span>
        </div>
      </div>
    </section>

    <section class="panel data-panel">
      <div class="section-heading">
        <div>
          <p class="eyebrow">DATA FORMAT</p>
          <h2>管理データ形式</h2>
        </div>
      </div>
      <pre id="json-preview">{}</pre>
    </section>
  </main>

  <dialog id="request-dialog" class="dialog">
    <form id="request-form" method="dialog">
      <div class="dialog-heading">
        <div>
          <p class="eyebrow" id="dialog-eyebrow">NEW REQUEST</p>
          <h2 id="dialog-title">リクエスト追加</h2>
        </div>
        <button type="button" id="close-dialog" class="icon-button" aria-label="閉じる">×</button>
      </div>
      <label class="field">
        <span>要求ID</span>
        <input id="form-id" type="text" required maxlength="200" placeholder="例: XXX">
      </label>
      <label class="field">
        <span>目的</span>
        <input id="form-purpose" type="text" required placeholder="例: テスト">
      </label>
      <label class="field">
        <span>実行コマンド</span>
        <textarea id="form-command" required rows="4" placeholder="例: echo helloworld"></textarea>
      </label>
      <p class="hint" id="form-hint">新規リクエストは「承認待ち」で登録されます。</p>
      <div class="dialog-actions">
        <button type="button" id="cancel-dialog" class="button secondary">キャンセル</button>
        <button type="submit" id="submit-request" class="button primary">登録</button>
      </div>
    </form>
  </dialog>

  <footer>
    <span>Orchestrator Manager</span>
    <span id="pwa-status">PWA対応</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
  <script src="./app.js"></script>
</body>
</html>
